version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - SENTINEL_SECRET_KEY=sentinel-docker-eval-secret-key-2026
      - ENVIRONMENT=production
    volumes:
      - sentinel-data:/app/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sentinel-data:
